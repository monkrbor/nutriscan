<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>NutriScan Admin</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=3.0">
<style>
  /* Layout : console d'administration — en-tête, onglets, contenu ; sur les écrans larges la liste et le détail sont côte à côte */
  body{min-height:100vh}
  .adm{max-width:1200px;margin:0 auto;padding-block:calc(env(safe-area-inset-top,0px) + 18px) 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
  .adm-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .adm-brand{display:flex;align-items:center;gap:12px;min-width:0}
  .adm-brand .logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(155deg,var(--hero-a),var(--hero-b));display:grid;place-items:center;color:#fff;flex:none}
  .adm-brand h1{font:800 24px/1.1 var(--display);letter-spacing:-.02em}
  .adm-brand p{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acts{display:flex;gap:8px;flex-wrap:wrap}
  .acts .btn{min-height:42px;font-size:14px;padding:0 14px;border-radius:13px}
  .nav{display:flex;gap:4px;overflow-x:auto;background:var(--surface);padding:5px;border-radius:16px;box-shadow:var(--shadow)}
  .nav button{border:0;background:none;padding:10px 14px;border-radius:12px;font-weight:800;font-size:14px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
  .nav button.on{background:var(--brand-soft);color:var(--brand-text)}
  .nav .badge{background:var(--danger);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
  .login{max-width:420px;width:100%;margin:40px auto 0;display:flex;flex-direction:column;gap:12px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .stat{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px}
  .stat b{display:block;font:800 28px/1.1 var(--display);letter-spacing:-.02em}
  .stat span{font-size:13px;color:var(--muted);font-weight:600}
  .stat.bad b{color:var(--danger)}
  .two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
  .panel{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
  .panel h2{font:800 18px/1.2 var(--display);letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .filters{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 10px}
  .filters button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--muted)}
  .filters button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-text)}
  /* Liste des comptes : une ligne par compte ; sur téléphone les colonnes passent sous le nom */
  .ulist-top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .ulist-top .searchbox{flex:1 1 260px;margin:0;border-radius:14px}
  .ulist{display:flex;flex-direction:column}
  .urow{display:grid;grid-template-columns:40px minmax(0,1.6fr) minmax(0,.8fr) minmax(0,1.2fr) minmax(0,1.1fr);gap:14px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:12px 8px;border-radius:0;color:var(--ink)}
  .urow:hover{background:var(--surface-2)}
  .urow.head{font-size:12px;font-weight:700;color:var(--muted);border-top:0;padding-block:4px}
  .urow.head:hover{background:none}
  .urow b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .urow small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
  .urow .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
  .urow .tags:empty{display:none}
  .av{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand-text);display:grid;place-items:center;font:800 16px/1 var(--display);flex:none}
  .av.big{width:56px;height:56px;font-size:22px}
  @media (max-width:760px){
    .urow{grid-template-columns:40px minmax(0,1fr);row-gap:6px}
    .urow.head{display:none}
    .urow .ucol{grid-column:2}
    .urow .ucol b{display:inline;font-size:14px}
    .urow .ucol small{display:inline;margin-left:6px}
  }
  .back{border:0;background:none;color:var(--brand-text);font-weight:800;font-size:15px;padding:4px 0;align-self:flex-start}
  #upage{display:flex;flex-direction:column;gap:16px}
  .uid{display:flex;gap:14px;align-items:center}
  .uid .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .nav.sub{box-shadow:none;background:var(--surface-2)}
  .nav.sub button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .daynav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .daynav input{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;height:36px;padding:0 10px}
  .chart{width:100%}
  .chart svg{display:block;width:100%;height:auto;overflow:visible}
  .chart text{fill:var(--faint);font:600 11px var(--body)}
  .chart text.lbl{fill:var(--ink);font-weight:800}
  .hb{display:flex;flex-direction:column;gap:6px}
  .hb-top{display:flex;justify-content:space-between;font-size:14px}
  .hb-top span{color:var(--muted);font-weight:600}
  .hb-track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
  .hb-track i{display:block;height:100%;border-radius:99px;background:var(--brand)}
  .tbl td.food{min-width:130px;overflow-wrap:anywhere}
  .tbl td.food small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
  .tbl td.nw{white-space:nowrap}
  .dayname{flex:1 1 100%;order:-1;text-transform:capitalize}
  table.click tbody tr{cursor:pointer}
  table.click tbody tr:hover,table.click tbody tr.on{background:var(--surface-2)}
  #tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--surface);font-size:13px;font-weight:700;padding:6px 10px;border-radius:10px;white-space:nowrap;box-shadow:var(--shadow)}
  .chip2{display:inline-block;border-radius:99px;padding:2px 8px;font-size:11px;font-weight:800;background:var(--surface-2);color:var(--muted);white-space:nowrap}
  .chip2.red{background:var(--danger-soft);color:var(--danger)} .chip2.orange{background:var(--warn-soft);color:var(--warn-text)} .chip2.green{background:var(--brand-soft);color:var(--brand-text)}
  h2.big{font:800 22px/1.2 var(--display);letter-spacing:-.02em;overflow-wrap:anywhere}
  .mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
  .mini div{background:var(--surface-2);border-radius:14px;padding:10px}
  .mini b{display:block;font:800 18px/1.2 var(--display)}
  .mini span{font-size:12px;color:var(--muted);font-weight:600}
  .sec h3{font:800 15px/1.2 var(--display);margin-bottom:8px}
  .tbl{overflow-x:auto}
  .tbl table{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th,.tbl td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
  .tbl th{color:var(--muted);font-weight:700;border-top:0;white-space:nowrap}
  .tbl td.num,.tbl th.num{text-align:right;white-space:nowrap}
  .tbl td.wrap{white-space:normal;overflow-wrap:anywhere;min-width:180px}
  .ver{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px;flex-wrap:wrap}
  .ver:first-child{border-top:0}
  .ver span{flex:1;min-width:160px}
  .ver .btn,.mbtn{min-height:36px;font-size:13px;padding:0 12px;border-radius:12px}
  textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;width:100%;min-height:90px;resize:vertical}
  textarea:focus{border-color:var(--brand);outline:none}
  select{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;height:48px;padding:0 12px;width:100%}
  .feed{display:flex;flex-direction:column}
  .ev{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
  .ev:first-child{border-top:0}
  .ev time{color:var(--muted);font-variant-numeric:tabular-nums}
  .ev b{font-weight:800}
  .ev small{display:block;color:var(--muted);overflow-wrap:anywhere}
  @media (max-width:520px){.ev{grid-template-columns:1fr;gap:2px}}
  .err{border-top:1px solid var(--line);padding:12px 0}
  .err:first-child{border-top:0}
  .err-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
  .err-top b{font-weight:800;overflow-wrap:anywhere}
  .err pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;background:var(--surface-2);border-radius:10px;padding:10px;margin:8px 0 0;max-height:220px;overflow:auto}
  .bars{width:100%}
  .bars svg{display:block;width:100%}
  .bars text{fill:var(--faint);font:600 10px var(--body)}
  .sec{min-width:0}
  .kv b{overflow-wrap:anywhere}
  .empty-d{color:var(--muted);text-align:center;padding:30px 10px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M13.5 8v8M17 8v8"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V5M7 10l5-5 5 5M5 20h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
</svg>
<div class="adm">
  <header class="adm-head">
    <div class="adm-brand"><span class="logo"><svg class="ic"><use href="#i-scan"/></svg></span><div class="min0"><h1>NutriScan Admin</h1><p id="who">Console d’administration</p></div></div>
    <div class="acts" id="topActs" hidden>
      <button class="btn outline" id="reload"><svg class="ic sm"><use href="#i-refresh"/></svg>Actualiser</button>
      <button class="btn outline" id="logout">Se déconnecter</button>
    </div>
  </header>

  <form class="card login" id="login" hidden autocomplete="on">
    <h2 style="font:800 20px/1.2 var(--display)">Connexion administrateur</h2>
    <div class="field"><label for="lEmail">E-mail</label><input id="lEmail" type="email" autocomplete="email"></div>
    <div class="field"><label for="lPass">Mot de passe</label><input id="lPass" type="password" autocomplete="current-password"></div>
    <p class="hint err" id="lErr" hidden></p>
    <button class="btn primary" type="submit">Se connecter</button>
    <button class="btn outline" type="button" id="lGoogle" hidden>Se connecter avec Google</button>
  </form>

  <div class="msg" id="notice" hidden></div>

  <section id="panel" hidden style="display:flex;flex-direction:column;gap:16px">
    <nav class="nav" id="nav" aria-label="Sections">
      <button data-v="overview" class="on">Vue d’ensemble</button>
      <button data-v="users">Utilisateurs</button>
      <button data-v="errors">Erreurs <span class="badge" id="errBadge" hidden></span></button>
      <button data-v="activity">Activité</button>
      <button data-v="messages">Messages</button>
    </nav>
    <div id="view"></div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>
<script src="exercises.js?v=3.0"></script>
<script src="recipes.js?v=3.0"></script>
<script src="config.js?v=3.0"></script>
<script src="cloud.js?v=3.0"></script>
<script src="admin.js?v=3.0"></script>
</body>
</html>
