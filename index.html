<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NutriScan</title>
<meta name="description" content="Compteur de calories et de macros avec scan de code-barres (Open Food Facts).">
<meta name="theme-color" id="themeColor" content="#F3F6F2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NutriScan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=2.1">
</head>
<body>

  <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10 8v8M13.5 8v8M17 8v8"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20h16M7 16v-4M12 16V7M17 16v-6"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 3c1 3.5 5.5 5.5 5.5 10.5a5.5 5.5 0 0 1-11 0c0-2.3 1.1-3.9 2.2-5 .1 2 1.1 3.1 2.3 3.1 0-3.3-.8-5.7 1-8.6z"/></symbol>
  <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
  <symbol id="i-sunrise" viewBox="0 0 24 24"><path d="M3 18h18M6.5 14.5a5.5 5.5 0 0 1 11 0M12 4v3M5 8.5l1.5 1.5M19 8.5L17.5 10M8 21.5h8"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></symbol>
  <symbol id="i-apple" viewBox="0 0 24 24"><path d="M12 7.5c-2-1.5-6.3-1.2-6.8 3.4C4.7 15.5 7.8 20.5 10 20.5c1 0 1.3-.5 2-.5s1 .5 2 .5c2.2 0 5.3-5 4.8-9.6-.5-4.6-4.8-4.9-6.8-3.4z"/><path d="M12 7.5c0-2 1-3.5 3-4"/></symbol>
  <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2.5L4.5 14H11l-1 7.5L18.5 10H12z"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V5M7 10l5-5 5 5M5 20h14"/></symbol>
  <symbol id="i-run" viewBox="0 0 24 24"><circle cx="14.5" cy="4.5" r="1.8"/><path d="M7 21l3.5-6 3 2.5V21M6 11.5l3.5-3.5 4 1 2 3.5 3 1M10.5 15l1.5-5.5"/></symbol>
  <symbol id="i-scale" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M8 10.5a4 4 0 0 1 8 0M12 10.5l1.6-2"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/></symbol>
  <symbol id="i-torch" viewBox="0 0 24 24"><path d="M7 3h10v4l-3 3v11h-4V10L7 7z"/><path d="M12 13v2"/></symbol>
  <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M7.5 14h9"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7.5-4.5-7.5-10A4.5 4.5 0 0 1 12 7a4.5 4.5 0 0 1 7.5 3c0 5.5-7.5 10-7.5 10z"/></symbol>

  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.4M12 16.8h.01"/></symbol>

<main class="screen" id="screen-journal">
  <header class="j-top">
    <div class="min0"><p class="hello" id="hello">Bonjour</p><h1 class="page-title" id="dayTitle">Aujourd'hui</h1></div>
    <div class="streak" id="streak" title="Jours suivis d'affilée"><svg class="ic sm" aria-hidden="true"><use href="#i-flame"/></svg><b id="streakN">0</b></div>
  </header>
  <nav class="week" aria-label="Choisir le jour">
    <button class="wk-arrow" data-act="wPrev" aria-label="Semaine précédente"><svg class="ic sm"><use href="#i-left"/></svg></button>
    <div class="wk-days" id="weekDays"></div>
    <button class="wk-arrow" data-act="wNext" id="wNext" aria-label="Semaine suivante"><svg class="ic sm"><use href="#i-right"/></svg></button>
  </nav>
  <section class="hero" aria-label="Résumé du jour">
    <div class="hero-top">
      <div class="hstat"><b class="num" id="hEaten">0</b><span>Mangé</span></div>
      <div class="hring" id="hRing">
        <svg viewBox="0 0 128 128" aria-hidden="true">
          <circle class="tr" cx="64" cy="64" r="54" fill="none" stroke-width="11"/>
          <circle class="vl" id="hRingVal" cx="64" cy="64" r="54" fill="none" stroke-width="11" stroke-linecap="round" stroke-dasharray="339.29 339.29" stroke-dashoffset="339.29"/>
        </svg>
        <div class="c"><b class="num" id="hRemain">0</b><span id="hRemainLbl">kcal restantes</span></div>
      </div>
      <div class="hstat"><b class="num" id="hBurned">0</b><span>Brûlé</span></div>
    </div>
    <div class="hero-macros" id="heroMacros"></div>
  </section>
  <div id="meals" style="display:flex;flex-direction:column;gap:12px"></div>
  <section class="card" id="waterCard"></section>
  <section class="card" id="activityCard"></section>
  <p class="credit">Produits : <a href="https://world.openfoodfacts.org" target="_blank" rel="noopener">Open Food Facts</a> (ODbL)</p>
</main>

<main class="screen" id="screen-progress" hidden></main>
<main class="screen" id="screen-profile" hidden></main>

<nav class="tabbar" aria-label="Navigation"><div class="in">
  <button class="tab on" data-act="tab" data-tab="journal"><svg class="ic"><use href="#i-book"/></svg>Journal</button>
  <button class="tab" data-act="tab" data-tab="progress"><svg class="ic"><use href="#i-chart"/></svg>Progrès</button>
  <button class="fab" data-act="fab" aria-label="Ajouter"><svg class="ic"><use href="#i-plus"/></svg></button>
  <button class="tab" data-act="scan"><svg class="ic"><use href="#i-scan"/></svg>Scanner</button>
  <button class="tab" data-act="tab" data-tab="profile"><svg class="ic"><use href="#i-user"/></svg>Profil</button>
</div></nav>

<div class="scrim" id="scrim"></div>

<div class="scanner" id="scanner" hidden role="dialog" aria-modal="true" aria-label="Scanner un code-barres">
  <div id="reader"></div>
  <div class="scan-ui">
    <div class="scan-top">
      <button class="sbtn" data-act="close" aria-label="Fermer"><svg class="ic"><use href="#i-x"/></svg></button>
      <h3>Scanner un code-barres</h3>
      <button class="sbtn" id="scTorch" data-act="scTorch" aria-label="Lampe" hidden><svg class="ic"><use href="#i-torch"/></svg></button>
      <span id="scTorchSpacer" style="width:46px"></span>
    </div>
    <div class="scan-frame" id="scFrame"><i class="scan-line"></i></div>
    <p class="scan-msg" id="scMsg">Place le code-barres dans le cadre</p>
    <div class="scan-bottom">
      <button class="spill" id="scZoom" data-act="scZoom" hidden>Zoom ×2</button>
      <button class="spill" data-act="scManual"><svg class="ic sm"><use href="#i-keyboard"/></svg>Taper le code</button>
    </div>
    <form class="scan-manual" id="scManualForm" hidden autocomplete="off">
      <input id="scCode" inputmode="numeric" placeholder="Code-barres (13 chiffres)" aria-label="Code-barres">
      <button class="btn primary" type="submit">OK</button>
    </form>
  </div>
</div>

<div class="onboard" id="onboard" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="foods.js?v=2.1"></script>
<script src="additives.js?v=2.1"></script>
<script src="halal.js?v=2.1"></script>
<script src="app.js?v=2.1"></script>
</body>
</html>
