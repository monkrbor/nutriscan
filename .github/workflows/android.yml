# Construit l'application Android (APK) et la publie dans la release « android ».
name: APK Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Clé de signature
        run: |
          P=$(openssl rand -hex 24)
          echo "::add-mask::$P"
          keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -alias nutriscan \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass "$P" -keypass "$P" -dname "CN=NutriScan, O=NutriScan"
          FP=$(keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$P" | grep 'SHA256:' | head -1 | sed 's/.*SHA256: *//')
          { echo "KS_FILE=$RUNNER_TEMP/release.jks"; echo "KS_PASS=$P"; echo "KS_FP=$FP"; } >> "$GITHUB_ENV"
      - name: Construire l'APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.${{ github.run_number }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace
      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk NutriScan.apk
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"io.github.monkrbor.nutriscan","sha256_cert_fingerprints":["%s"]}}]\n' "$KS_FP" > assetlinks.json
          NOTES="Application Android de NutriScan (version 1.${{ github.run_number }}). Mode d'emploi : https://monkrbor.github.io/nutriscan/installer.html

          Empreinte SHA-256 : $KS_FP"
          if gh release view android >/dev/null 2>&1; then gh release edit android --notes "$NOTES"
          else gh release create android --title "NutriScan pour Android" --notes "$NOTES"; fi
          gh release upload android NutriScan.apk assetlinks.json --clobber
